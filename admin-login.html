<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUST Hub - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <span class="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded-lg text-xs">KINGGA / ADMIN</span>
            <h1 class="text-2xl font-bold">Ingia kwenye Dashboard</h1>
            <p class="text-slate-400 text-sm">Weka taarifa zako za ki-admin kuendelea</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Username</label>
                <input type="text" id="username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-amber-500">
            </div>
            <p id="errorMsg" class="text-red-400 text-sm text-center hidden"></p>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-3 rounded-lg transition">
                Ingia Sasa
            </button>
        </form>

        <div class="text-center">
            <a href="index.html" class="text-sm text-slate-500 hover:text-slate-300 transition">Rudi kwenye Ukurasa wa Mwanzo</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    // Weka alama kuwa ameruhusiwa kupitia SessionStorage
                    sessionStorage.setItem('isAdminAuthenticated', 'true');
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.innerText = data.message;
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.innerText = 'Imeshindwa kuunganisha na server.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
